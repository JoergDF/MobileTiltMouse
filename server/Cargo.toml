[package]
name = "mobile_tilt_mouse"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm-siv = "0.12.0"
enigo = { version = "0.6.1", default-features = false, features = ["xdo"] }
hex = "0.4.3"
hkdf = "0.13.0"
p12-keystore = "0.4.1"
quinn = "0.11.9"
rand = "0.10.0"
rand_pcg = "0.10.1"
rand_core = "0.10.0"
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std"] }
sha2 = "0.11.0"
tokio = { version = "1.51.1", features = ["full"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = "0.3.23"
zeroize = "1.8.2"

[target.'cfg(target_os = "macos")'.dependencies]
zeroconf = "0.18.0"

[target.'cfg(not(target_os = "macos"))'.dependencies]
mdns-sd = "0.21.7"
hostname = "0.4.2"

[dev-dependencies]
rdev = "0.5.3"

[build-dependencies]
hex = "0.4.3"
rcgen = { version = "0.14.7", features = ["aws_lc_rs"] }
p12-keystore = "0.4.1"
rand = "0.10.0"
rand_pcg = "0.10.1"
rand_core = "0.10.0"
sha2 = "0.11.0"
